name: Build LineageOS PSP 0.1.5

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CyanogenPSP-derived LineageOS PSP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Check out LineageOS PSP layers
        uses: actions/checkout@v4

      - name: Fetch the upstream CyanogenPSP source
        run: |
          git clone https://github.com/omarmc9203/CyanogenPSP.git CyanogenPSP
          git -C CyanogenPSP checkout 0a98c8b0c7503b54612e4d8d2de1f3010bc48fa4
          git clone --recurse-submodules https://github.com/dogo/oslib.git OSLib
          git -C OSLib checkout c9ab75c7a2b9a255ed126a21288f9f4c389fb266
          git -C OSLib submodule update --init --recursive

      - name: Build modern OSLib against the active PSPDEV toolchain
        run: |
          set -euo pipefail
          make -C OSLib libosl.a
          test -s OSLib/libosl.a
          make -C OSLib install DESTDIR="$GITHUB_WORKSPACE/OSLibInstall"
          OSLIB_HEADERS="$GITHUB_WORKSPACE/OSLibInstall/usr/local/pspdev/psp/include/oslib"
          test -d "$OSLIB_HEADERS"
          cp -a "$OSLIB_HEADERS/." CyanogenPSP/include/oslib/
          cp OSLib/libosl.a CyanogenPSP/libs/libosl.a

      - name: Apply LineageOS PSP compatibility and identity layers
        shell: bash
        run: |
          set -euo pipefail
          cd CyanogenPSP

          # Restore the legacy OSLib fd_set include path using the current PSPDEV header.
          mkdir -p include/sys
          cp ../overlays/lineage/include/sys/fd_set.h include/sys/fd_set.h
          # Keep battery EEPROM write operations disabled in the LineageOS layer.
          sed -i 's|chWriteSerial(BatSer);|/* LineageOS PSP disables battery EEPROM writes. */|' include/common.c
          # The current OSLib API adds an explicit angle parameter; preserve the old zero-angle layout.
          grep -RIl 'oslIntraFontSetStyle' . | xargs -r sed -i \
            -e '/oslIntraFontSetStyle/s/,[[:space:]]*INTRAFONT_ALIGN_LEFT);/, 0, INTRAFONT_ALIGN_LEFT);/' \
            -e '/oslIntraFontSetStyle/s/,[[:space:]]*INTRAFONT_ALIGN_CENTER);/, 0, INTRAFONT_ALIGN_CENTER);/' \
            -e '/oslIntraFontSetStyle/s/,[[:space:]]*0);/, 0, 0);/'
          grep -Fq 'LineageOS PSP disables battery EEPROM writes' include/common.c

          # Avoid the legacy image variable colliding with the POSIX select() declaration.
          sed -i 's/[*]select, [*]deselect;/*selectIcon, *deselect;/' settingsMenu.h
          grep -Fq '*selectIcon, *deselect;' settingsMenu.h
          ! grep -Fq '*select, *deselect;' settingsMenu.h
          sed -i \
            -e 's/select = oslLoadImageFilePNG/selectIcon = oslLoadImageFilePNG/g' \
            -e 's/deselectIcon = oslLoadImageFilePNG/deselect = oslLoadImageFilePNG/g' \
            -e 's/!select ||/!selectIcon ||/g' \
            -e 's/oslDrawImageXY(select,/oslDrawImageXY(selectIcon,/g' \
            -e 's/oslDeleteImage(select)/oslDeleteImage(selectIcon)/g' \
            settingsMenu.c

          # Product identity and release version.
          sed -i 's/^TARGET = CyanogenPSP$/TARGET = LineageOS-PSP/' Makefile
          sed -i 's/^VERSION[[:space:]]*=.*/VERSION = 0.1.5/' Makefile
          # Emit a linker map so PPSSPP crash addresses can be mapped back to symbols.
          sed -i 's|^LDFLAGS =.*|LDFLAGS = -Wl,-Map,LineageOS-PSP.map|' Makefile
          sed -i 's/-Wall -Werror/-Wall/' Makefile
          sed -i 's/^CFLAGS = /CFLAGS = -fcommon /' Makefile
          sed -i 's/^PSP_EBOOT_TITLE =.*/PSP_EBOOT_TITLE = LineageOS PSP v$(VERSION)/' Makefile
          sed -i 's/PSP_MODULE_INFO("CyanogenPSP",[[:space:]]*1, 6, 0);/PSP_MODULE_INFO("LineageOS PSP", 1, 0, 2);/' main.c
          sed -i 's/CyanogenPSP/LineageOS PSP/g' main.c

          # Adapt two declarations that changed with the modern PSPDEV compiler/headers.
          grep -RIl 'pspTime' . | xargs -r sed -i 's/pspTime/ScePspDateTime/g'
          grep -RIl 'time.minutes' . | xargs -r sed -i 's/time[.]minutes/time.minute/g'
          sed -i 's/int imposeSetVolume();/int imposeSetVolume(int value);/' homeMenu.c
          # GetBatSer returns the serial value; store that value before writing the dump.
          sed -i 's/char BatSerCurrent.*/u32 BatSerCurrent;/' recoveryMenu.c
          sed -i 's/GetBatSer(BatSerCurrent);/BatSerCurrent = GetBatSer();/' recoveryMenu.c
          sed -i 's|WriteFile("ms0:/batser.bin", BatSerCurrent, 4);|WriteFile("ms0:/batser.bin", \&BatSerCurrent, 4);|' recoveryMenu.c
          grep -Fq 'BatSerCurrent = GetBatSer();' recoveryMenu.c
          # Use POSIX case-insensitive comparison and match the app drawer's no-argument call.
          sed -i '1i#include <strings.h>' fileManager.c
          sed -i 's/stricmp/strcasecmp/g' fileManager.c
          sed -i 's/int filemanage(int argc, char .*)/int filemanage(void)/' fileManager.c
          sed -i 's/int filemanage();/int filemanage(void);/' fileManager.h
          grep -q 'int filemanage(void)' fileManager.c
          grep -q 'int filemanage(void);' fileManager.h

          # Fail early if any of the required overlays did not apply.
          grep -q '^TARGET = LineageOS-PSP$' Makefile
          grep -q '^VERSION = 0.1.5$' Makefile
          grep -q 'PSP_MODULE_INFO("LineageOS PSP", 1, 0, 2);' main.c
          grep -q 'ScePspDateTime time;' homeMenu.c
          grep -q 'int imposeSetVolume(int value);' homeMenu.c

      - name: Build required kernel modules
        run: |
          set -euo pipefail
          cd CyanogenPSP
          # The upstream PRX makefiles use an obsolete GCC switch removed by current PSPDEV.
          sed -i 's/-mno-crt0 //g' prx/display/Makefile prx/control/Makefile prx/impose/Makefile
          mkdir -p modules
          for module in display control impose; do
            make -C "prx/$module" clean
            make -C "prx/$module"
            test -s "prx/$module/$module.prx"
            cp "prx/$module/$module.prx" "modules/$module.prx"
          done

      - name: Harden first-boot configuration file handling
        run: |
          set -euo pipefail
          # The PSPDEV container is Alpine-based and does not include Python by default.
          apk add --no-cache python3 cmake curl
          sed -i -f overlays/lineage/fix_startup.sed CyanogenPSP/include/utils.c
          sed -i -f overlays/lineage/fix_main.sed CyanogenPSP/main.c
          grep -q 'if (!temp) return value;' CyanogenPSP/include/utils.c
          grep -q 'if (temp)' CyanogenPSP/main.c
          python3 overlays/lineage/disable_bootanimation.py
          grep -q 'boot animation temporarily disabled' CyanogenPSP/main.c

      - name: Fetch and build Tilefinch with native DNS over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          export PATH="$PSPDEV/bin:$PATH"

          git clone https://github.com/stjanovitz/tilefinch.git Tilefinch
          git -C Tilefinch checkout --detach c1a4b7ac97e8057bd5ec52a6a5383587090c2484

          # Patch the owned PSP curl transport: DoH is mandatory, and the
          # Cloudflare DoH endpoint is pinned by IP for its initial bootstrap.
          python3 overlays/lineage/patch_tilefinch_doh.py Tilefinch
          grep -Fq 'CURLOPT_DOH_URL' Tilefinch/src/fetch.c
          grep -Fq 'cloudflare-dns.com:443:1.1.1.1' Tilefinch/src/fetch.c
          grep -Fq 'tilefinch_psp_cares' Tilefinch/cmake/PspOwnedTransport.cmake
          grep -Fq 'CURL_DISABLE_DOH=OFF' Tilefinch/cmake/PspOwnedTransport.cmake

          # Download and verify every hash-pinned PSP transport dependency,
          # including the c-ares async resolver needed by libcurl DoH.
          cd Tilefinch
          ./scripts/fetch-psp-transport-deps.sh

          # Tilefinch's own PSP preset builds the full launcher/browser install
          # tree, including the fonts, TLS roots, A/B slots and third-party notices.
          cmake --preset psp
          cmake --build build-preset-psp --target tilefinch-psp-install-tree -j2
          cd ..

          # The LineageOS Internet icon now launches this bundled EBOOT.
          python3 overlays/lineage/launch_tilefinch.py CyanogenPSP/homeMenu.c

          mkdir -p dist
          cp -a Tilefinch/build-preset-psp/tilefinch-install/Tilefinch dist/TILEFINCH
          test -s dist/TILEFINCH/EBOOT.PBP
          test -s dist/TILEFINCH/slot-a/EBOOT.PBP
          test -d dist/TILEFINCH/slot-b
          test -d dist/TILEFINCH/data
          test -d dist/TILEFINCH/NOTICES

      - name: Apply versioned LineageOS PSP identity to source code
        run: |
          set -euo pipefail
          python3 overlays/lineage/apply_identity.py

      - name: Configure application heap for PPSSPP
        run: |
          set -euo pipefail
          # The upstream CyanogenPSP source explicitly documents 53248 KiB for PPSSPP testing.
          sed -i 's/PSP_HEAP_SIZE_KB(20\*1024)/PSP_HEAP_SIZE_KB(53248)/' CyanogenPSP/main.c
          grep -q 'PSP_HEAP_SIZE_KB(53248)' CyanogenPSP/main.c

      - name: Compile LineageOS PSP
        run: |
          set -euo pipefail
          cd CyanogenPSP
          make clean
          make
          test -s EBOOT.PBP
          file EBOOT.PBP || true

      - name: Preserve ELF debug symbols and linker map
        run: |
          set -euo pipefail
          mkdir -p debug-symbols
          ELF_FILE="$(find CyanogenPSP -maxdepth 1 -type f -name '*.elf' -print -quit)"
          if [ -z "$ELF_FILE" ]; then
            echo "The PSP linker did not leave an ELF file; listing build outputs:"
            find CyanogenPSP -maxdepth 2 -type f -printf '%p\\n' | sort
            exit 1
          fi
          cp "$ELF_FILE" debug-symbols/LineageOS-PSP.elf
          if [ -s CyanogenPSP/LineageOS-PSP.map ]; then
            cp CyanogenPSP/LineageOS-PSP.map debug-symbols/LineageOS-PSP.map
          fi
          test -s debug-symbols/LineageOS-PSP.elf

      - name: Upload crash-diagnostics symbols
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-PSP-0.1.5-debug-symbols
          path: debug-symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Verify complete install folder
        run: |
          set -euo pipefail
          test -s CyanogenPSP/EBOOT.PBP
          test -d CyanogenPSP/modules
          test -d CyanogenPSP/system
          test -d CyanogenPSP/system/settings
          test -s CyanogenPSP/modules/display.prx
          test -s CyanogenPSP/modules/control.prx
          test -s CyanogenPSP/modules/impose.prx

      - name: Stage complete install folder for distribution
        run: |
          set -euo pipefail
          INSTALL_DIR="LineageOS PSP ver.0.1.5"
          mkdir -p "dist/$INSTALL_DIR"
          cp -a CyanogenPSP/EBOOT.PBP CyanogenPSP/modules CyanogenPSP/system "dist/$INSTALL_DIR/"
          test -s "dist/$INSTALL_DIR/EBOOT.PBP"
          test -d "dist/$INSTALL_DIR/modules"
          test -d "dist/$INSTALL_DIR/system/settings"
          test -s "dist/TILEFINCH/EBOOT.PBP"
          test -s "dist/TILEFINCH/slot-a/EBOOT.PBP"
          test -d "dist/TILEFINCH/NOTICES"

      - name: Upload complete install folder
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-PSP-0.1.5
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish LineageOS PSP 0.1.5
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Download installation package
        uses: actions/download-artifact@v4
        with:
          name: LineageOS-PSP-0.1.5
          path: dist

      - name: Package and verify LineageOS PSP installation ZIP
        run: |
          set -euo pipefail
          INSTALL_DIR="LineageOS PSP ver.0.1.5"
          test -s "dist/$INSTALL_DIR/EBOOT.PBP"
          test -d "dist/$INSTALL_DIR/modules"
          test -d "dist/$INSTALL_DIR/system/settings"
          test -s "dist/TILEFINCH/EBOOT.PBP"
          test -s "dist/TILEFINCH/slot-a/EBOOT.PBP"
          mkdir -p package
          cp -a "dist/$INSTALL_DIR" package/
          cp -a "dist/TILEFINCH" package/
          test -s "package/$INSTALL_DIR/EBOOT.PBP"
          test -d "package/$INSTALL_DIR/modules"
          test -d "package/$INSTALL_DIR/system/settings"
          test -s "package/TILEFINCH/EBOOT.PBP"
          test -s "package/TILEFINCH/slot-a/EBOOT.PBP"
          test -d "package/TILEFINCH/NOTICES"
          cd package
          zip -qr ../LineageOS-PSP-0.1.5.zip "$INSTALL_DIR" TILEFINCH
          cd ..
          unzip -Z1 LineageOS-PSP-0.1.5.zip | grep -Fqx "$INSTALL_DIR/EBOOT.PBP"
          unzip -Z1 LineageOS-PSP-0.1.5.zip | grep -Fq "$INSTALL_DIR/modules/"
          unzip -Z1 LineageOS-PSP-0.1.5.zip | grep -Fq "$INSTALL_DIR/system/"
          unzip -Z1 LineageOS-PSP-0.1.5.zip | grep -Fqx "TILEFINCH/EBOOT.PBP"
          unzip -Z1 LineageOS-PSP-0.1.5.zip | grep -Fqx "TILEFINCH/slot-a/EBOOT.PBP"
 
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5
          name: LineageOS PSP 0.1.5
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/LineageOS PSP ver.0.1.5/EBOOT.PBP
            LineageOS-PSP-0.1.5.zip
          body: |
            LineageOS PSP 0.1.5 — navigateur Tilefinch intégré.

            Le bouton Internet de LineageOS PSP lance Tilefinch, compilé depuis sa source amont épinglée. Le transport PSP applique DNS over HTTPS via Cloudflare avec validation TLS et bootstrap DoH épinglé.

            Installation : extraire le contenu de ce ZIP directement dans PSP/GAME/.
            Le ZIP contient deux dossiers : « LineageOS PSP ver.0.1.5/ » et « TILEFINCH/ ». Ne pas déplacer ni renommer TILEFINCH : LineageOS PSP l'utilise pour lancer le navigateur.
            Le dossier TILEFINCH conserve les slots, les données, les certificats et les notices de licences amont.
            Le firmware officiel et le menu XMB restent intacts.
